services:
  - type: web
    name: smarteda-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://smarteda.netlify.app,http://localhost:5173
      - key: PYTHON_VERSION
        value: 3.11.0
